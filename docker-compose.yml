name: cobre-notification

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: notifications
      POSTGRES_USER: notifications
      POSTGRES_PASSWORD: notifications
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notifications -d notifications"]
      interval: 5s
      timeout: 5s
      retries: 20

  kafka:
    image: apache/kafka:4.1.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # INTERNAL is used by other containers, EXTERNAL by the app running on the host.
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:29092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 15s

  kafka-init:
    image: apache/kafka:4.1.0
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        for topic in platform.events.v1 platform.events.v1.DLT; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists \
            --topic "$$topic" --partitions 6 --replication-factor 1
        done
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --list

  webhook-mock:
    image: wiremock/wiremock:3.13.1
    command: ["--disable-banner"]
    ports:
      - "8089:8080"
    volumes:
      - ./docker/wiremock/mappings:/home/wiremock/mappings:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/__admin/health > /dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      webhook-mock:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: local,demo
      DB_URL: jdbc:postgresql://postgres:5432/notifications
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      WEBHOOK_URL: ${WEBHOOK_URL:-http://webhook-mock:8080/webhook/ok}
      WEBHOOK_FLAKY_URL: ${WEBHOOK_FLAKY_URL:-http://webhook-mock:8080/webhook/flaky}
      WEBHOOK_FAILING_URL: ${WEBHOOK_FAILING_URL:-http://webhook-mock:8080/webhook/error}
      WEBHOOK_SIGNING_SECRET: ${WEBHOOK_SIGNING_SECRET:-}
      WEBHOOK_SSRF_ALLOWED_HOSTS: ${WEBHOOK_SSRF_ALLOWED_HOSTS:-}
      CLIENT001_API_KEY: ${CLIENT001_API_KEY:-dev-client-001}
      CLIENT002_API_KEY: ${CLIENT002_API_KEY:-dev-client-002}
      CLIENT003_API_KEY: ${CLIENT003_API_KEY:-dev-client-003}
      OPS_API_KEY: ${OPS_API_KEY:-dev-ops}
    ports:
      - "8080:8080"
      - "8081:8081"

volumes:
  postgres-data:
