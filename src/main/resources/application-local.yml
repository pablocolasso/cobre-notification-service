spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/notifications}
    username: ${DB_USERNAME:notifications}
    password: ${DB_PASSWORD:notifications}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

app:
  security:
    api-keys:
      - name: client-001
        key: ${CLIENT001_API_KEY:dev-client-001}
        role: CLIENT
        client-id: CLIENT001
      - name: client-002
        key: ${CLIENT002_API_KEY:dev-client-002}
        role: CLIENT
        client-id: CLIENT002
      - name: client-003
        key: ${CLIENT003_API_KEY:dev-client-003}
        role: CLIENT
        client-id: CLIENT003
      - name: ops
        key: ${OPS_API_KEY:dev-ops}
        role: OPERATOR
  webhook:
    ssrf:
      allowed-hosts:
        - webhook-mock
        - localhost
        - 127.0.0.1
