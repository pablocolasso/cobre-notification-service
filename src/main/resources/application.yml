spring:
  application:
    name: cobre-notification-service
  threads:
    virtual:
      enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  datasource:
    hikari:
      maximum-pool-size: 30
      data-source-properties:
        # Otherwise PostgreSQL errors quote the failing row ("Failing row contains ..."), content included.
        logServerErrorDetail: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    consumer:
      group-id: notification-service
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    listener:
      ack-mode: record

logging:
  pattern:
    # Same layout as the Spring Boot default plus %kvp and %mdc.
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %5p [%15.15t] %-40.40logger{39} : %m %kvp %mdc%n%wEx"

management:
  server:
    port: ${MANAGEMENT_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

app:
  kafka:
    topics:
      platform-events: platform.events.v1
      platform-events-dlt: platform.events.v1.DLT
    consumer:
      retry:
        initial-interval: 1s
        multiplier: 2.0
        max-interval: 30s
  delivery:
    lease-duration: 60s
    worker:
      enabled: true
      poll-interval: 500ms
      max-concurrency: 20
      recovery-batch-size: 100
    retry:
      base-delay: 5s
      max-delay: 10m
      max-attempts: 5
  webhook:
    connect-timeout: 2s
    request-timeout: 5s
    ssrf:
      strict: true
      allowed-hosts: []
      extra-allowed-hosts: ${WEBHOOK_SSRF_ALLOWED_HOSTS:}
